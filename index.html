<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense & Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css" />
    <!-- Chart.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>

    <!-- ===== HEADER ===== -->
    <header>
      <h1>Expense &amp; Budget Visualizer</h1>
    </header>

    <main>

      <!-- ===== TOTAL BALANCE CARD ===== -->
      <section id="balance-card">
        <p class="balance-label">Total Balance</p>
        <p class="balance-amount" id="total-balance">Rp 0</p>
      </section>

      <!-- ===== ADD TRANSACTION FORM ===== -->
      <section id="add-transaction">
        <h2>Add Transaction</h2>
        <form id="transaction-form">

          <div class="form-group">
            <label for="item-name">Item Name</label>
            <input
              type="text"
              id="item-name"
              name="item-name"
              placeholder="e.g. Lunch, Bus fare"
              required
            />
          </div>

          <div class="form-group">
            <label for="amount">Amount (Rp)</label>
            <input
              type="number"
              id="amount"
              name="amount"
              placeholder="e.g. 15000"
              min="1"
              required
            />
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" required>
              <option value="" disabled selected>Select a category</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
          </div>

          <button type="submit" id="submit-btn">Add Transaction</button>

        </form>
      </section>

      <!-- ===== TRANSACTION LIST ===== -->
      <section id="transaction-list">
        <h2>Transactions</h2>
        <ul id="transactions"></ul>
      </section>

      <!-- ===== SPENDING CHART ===== -->
      <section id="chart-section">
        <h2>Spending by Category</h2>
        <canvas id="spending-chart" aria-label="Spending breakdown chart"></canvas>
      </section>

    </main>

    <!-- Load app logic last -->
    <script src="js/script.js"></script>
  </body>
</html>
