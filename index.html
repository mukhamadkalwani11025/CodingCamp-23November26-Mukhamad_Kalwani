<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense & Budget Visualizer</title>

  <!-- Font (jika offline, otomatis memakai font bawaan sistem) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">

    <!-- Header -->
    <header class="app-header">
      <div>
        <h1>Expense &amp; Budget Visualizer</h1>
        <p class="tagline">Track what you spend and see where it goes.</p>
      </div>
      <button type="button" id="toggle-mode-btn" class="mode-btn">🌙 Dark mode</button>
    </header>

    <main class="layout">

      <!-- Total balance + spending limit -->
      <section id="balance-card" class="hero">
        <div class="hero-main">
          <p class="hero-label">Total balance</p>
          <h2 id="total-balance">$0.00</h2>
        </div>

        <div class="hero-limit">
          <div class="limit-row">
            <label for="spending-limit">Spending limit</label>
            <input type="number" id="spending-limit" min="0" step="any" placeholder="e.g. 50">
          </div>
          <div class="meter">
            <div class="meter-track"><div id="limit-fill" class="meter-fill"></div></div>
            <p id="limit-text" class="meter-text">No limit set</p>
          </div>
        </div>
      </section>

      <!-- Add transaction -->
      <section class="card form-card">
        <h3>Add transaction</h3>
        <form id="transaction-form">
          <div class="field">
            <label for="item-name">Item name</label>
            <input type="text" id="item-name" placeholder="e.g. Lunch">
          </div>

          <div class="field-row">
            <div class="field">
              <label for="amount">Amount</label>
              <input type="number" id="amount" min="0" step="any" placeholder="e.g. 12.50">
            </div>

            <div class="field">
              <label for="category">Category</label>
              <select id="category">
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Fun">Fun</option>
              </select>
            </div>
          </div>

          <p id="form-error" role="alert"></p>
          <button type="submit" class="btn-primary">Add transaction</button>
        </form>
      </section>

      <!-- Transactions -->
      <section class="card list-card">
        <div class="list-header">
          <h3>Transactions</h3>
          <select id="sort-select" aria-label="Sort transactions">
            <option value="default">Sort: Default</option>
            <option value="amount-desc">Amount: high to low</option>
            <option value="amount-asc">Amount: low to high</option>
            <option value="category-az">Category: A-Z</option>
          </select>
        </div>
        <ul id="transaction-list"></ul>
      </section>

      <!-- Chart -->
      <section class="card chart-card">
        <h3>Spending by category</h3>
        <div class="chart-wrap">
          <canvas id="spending-chart"></canvas>
          <p id="chart-empty" class="chart-empty">Your chart appears after the first transaction.</p>
        </div>
      </section>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
